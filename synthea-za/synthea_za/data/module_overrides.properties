# Numeric overrides applied to Synthea's built in modules for South Africa.
# Format: <module file name>::<JSONPath to a number> = <new value>
# These are applied when the module JSON is loaded (see Module.applyOverrides).
# This is a Java .properties file: colons and spaces inside keys are escaped with a
# backslash, exactly as Synthea's own ModuleOverrides tool writes them.
# This is a Java .properties file: colons and spaces inside keys are escaped with a
# backslash, exactly as Synthea's own ModuleOverrides tool writes them.

# ---- Hypertension (SADHS 2016: 46% of women and 44% of men aged 15+; roughly 25% at 25-34,
# ---- 45% at 35-44, 60% at 45-54 and 75% at 55-64). The module's value is the lifetime share who
# ---- eventually develop hypertension; onset age is drawn from a normal distribution.
hypertension.json\:\:$.states.Black.value = 0.68
hypertension.json\:\:$.states['White\ Male'].value = 0.60
hypertension.json\:\:$.states['White\ Female'].value = 0.55
hypertension.json\:\:$.states['All\ Others'].value = 0.66
hypertension.json\:\:$.states['Black\ Onset\ Age'].distribution.parameters.mean = 37
hypertension.json\:\:$.states['Black\ Onset\ Age'].distribution.parameters.standardDeviation = 14
hypertension.json\:\:$.states['White\ Onset\ Age'].distribution.parameters.mean = 43
hypertension.json\:\:$.states['White\ Onset\ Age'].distribution.parameters.standardDeviation = 14

# ---- Diabetes (SANHANES-1 HbA1c based: Black African 8.9%, Coloured 9.9%, White 16%,
# ---- Indian 32%; prediabetes 13.8% / 17.4% / 29% for Black African / Coloured / Indian). The module's "eventual" shares are
# ---- lifetime risks that produce the point prevalence after the onset delay.
# White
metabolic_syndrome_disease.json\:\:$.states.Non_Veteran_Diabetes_Prevalence.complex_transition[0].distributions[0].distribution = 0.3
metabolic_syndrome_disease.json\:\:$.states.Non_Veteran_Diabetes_Prevalence.complex_transition[0].distributions[1].distribution = 0.33
metabolic_syndrome_disease.json\:\:$.states.Non_Veteran_Diabetes_Prevalence.complex_transition[0].distributions[2].distribution = 0.37
# Hispanic (unused in South Africa, kept consistent)
metabolic_syndrome_disease.json\:\:$.states.Non_Veteran_Diabetes_Prevalence.complex_transition[1].distributions[0].distribution = 0.28
metabolic_syndrome_disease.json\:\:$.states.Non_Veteran_Diabetes_Prevalence.complex_transition[1].distributions[1].distribution = 0.32
metabolic_syndrome_disease.json\:\:$.states.Non_Veteran_Diabetes_Prevalence.complex_transition[1].distributions[2].distribution = 0.4
# Black African
metabolic_syndrome_disease.json\:\:$.states.Non_Veteran_Diabetes_Prevalence.complex_transition[2].distributions[0].distribution = 0.25
metabolic_syndrome_disease.json\:\:$.states.Non_Veteran_Diabetes_Prevalence.complex_transition[2].distributions[1].distribution = 0.3
metabolic_syndrome_disease.json\:\:$.states.Non_Veteran_Diabetes_Prevalence.complex_transition[2].distributions[2].distribution = 0.45
# Indian or Asian
metabolic_syndrome_disease.json\:\:$.states.Non_Veteran_Diabetes_Prevalence.complex_transition[3].distributions[0].distribution = 0.55
metabolic_syndrome_disease.json\:\:$.states.Non_Veteran_Diabetes_Prevalence.complex_transition[3].distributions[1].distribution = 0.28
metabolic_syndrome_disease.json\:\:$.states.Non_Veteran_Diabetes_Prevalence.complex_transition[3].distributions[2].distribution = 0.17
# Native (unused)
metabolic_syndrome_disease.json\:\:$.states.Non_Veteran_Diabetes_Prevalence.complex_transition[4].distributions[0].distribution = 0.28
metabolic_syndrome_disease.json\:\:$.states.Non_Veteran_Diabetes_Prevalence.complex_transition[4].distributions[1].distribution = 0.32
metabolic_syndrome_disease.json\:\:$.states.Non_Veteran_Diabetes_Prevalence.complex_transition[4].distributions[2].distribution = 0.4
# Coloured and everyone else
metabolic_syndrome_disease.json\:\:$.states.Non_Veteran_Diabetes_Prevalence.complex_transition[5].distributions[0].distribution = 0.28
metabolic_syndrome_disease.json\:\:$.states.Non_Veteran_Diabetes_Prevalence.complex_transition[5].distributions[1].distribution = 0.34
metabolic_syndrome_disease.json\:\:$.states.Non_Veteran_Diabetes_Prevalence.complex_transition[5].distributions[2].distribution = 0.38

# ---- Injuries: South Africa's interpersonal violence and road traffic burden is far above
# ---- the US rates in the built in module (homicide about 45 per 100 000, 60% by firearm).
injuries.json\:\:$.states.Adult_Incidence_Rates.distributed_transition[1].distribution = 0.0012
injuries.json\:\:$.states.Adult_Incidence_Rates.distributed_transition[11].distribution = 0.940522306
injuries.json\:\:$.states.Adult_Incidence_Rates.distributed_transition[4].distribution = 0.0082
injuries.json\:\:$.states.Adult_Incidence_Rates.distributed_transition[5].distribution = 0.0052
injuries.json\:\:$.states.Child_Incidence_Rates.distributed_transition[5].distribution = 0.0052
injuries.json\:\:$.states.Child_Incidence_Rates.distributed_transition[11].distribution = 0.910529816

# ---- Prescription opioid misuse is far less common than in the United States.
opioid_addiction.json\:\:$.states.Directed_Use.distributed_transition[2].distribution = 0.005
opioid_addiction.json\:\:$.states.Directed_Use.distributed_transition[3].distribution = 0.75687
