# Synthea configuration for the South African population generator (synthea-za).
# Values here are merged over Synthea's built-in synthea.properties; synthea-za rewrites a
# few of them at run time (years of history, note export, output directory).

# ---------------------------------------------------------------- export
exporter.years_of_history = 10
exporter.pretty_print = true
exporter.metadata.export = true
exporter.fhir.export = true
exporter.fhir.transaction_bundle = true
# South African data must not carry the US Core profiles, race or birth-sex extensions
exporter.fhir.use_us_core_ig = false
exporter.fhir.bulk_data = false
exporter.hospital.fhir.export = true
exporter.practitioner.fhir.export = true
exporter.ccda.export = false
exporter.csv.export = false
exporter.clinical_note.export = false

# ---------------------------------------------------------------- names
generate.append_numbers_to_person_names = false
generate.middle_names = 0.55

# ---------------------------------------------------------------- geography
generate.demographics.default_file = geography/demographics.csv
generate.geography.zipcodes.default_file = geography/zipcodes.csv
generate.geography.timezones.default_file = geography/timezones.csv
generate.geography.foreign.birthplace.default_file = geography/foreign_birthplace.json
generate.geography.sdoh.default_file = geography/sdoh.csv
generate.geography.country_code = ZA
generate.geography.passport_uri = http://hl7.org/fhir/sid/passport-ZAF
# first language by population group and province; drives the name pools in names.yml
generate.demographics.languages.default_file = languages.json
# the OTHER column of demographics.csv is the Coloured population group
generate.demographics.honor_other_race_column = true
generate.veteran_population_override = false

# ---------------------------------------------------------------- socio-economics
# incomes in demographics.csv are annual household income in thousands of US dollars so
# that Synthea's cost and affordability model keeps working; R18 to the dollar is assumed.
# Poverty line: roughly the upper-bound poverty line for a household of four.
generate.demographics.socioeconomic.income.poverty = 5000
generate.demographics.socioeconomic.income.high = 30000
generate.demographics.socioeconomic.weights.income = 0.3
generate.demographics.socioeconomic.weights.education = 0.6
generate.demographics.socioeconomic.weights.occupation = 0.1

# ---------------------------------------------------------------- providers
generate.providers.hospitals.default_file = providers/hospitals.csv
generate.providers.primarycare.default_file = providers/primary_care.csv
generate.providers.urgentcare.default_file = providers/urgent_care.csv
generate.providers.dialysis.default_file = providers/dialysis.csv
generate.providers.hospice.default_file = providers/hospice.csv
generate.providers.nursing.default_file = providers/nursing.csv
generate.providers.homehealth.default_file = providers/home_health.csv
generate.providers.longterm.default_file = providers/hospitals.csv
generate.providers.rehab.default_file = providers/hospitals.csv
# the veterans file must exist because Synthea always loads it; no South African patient is
# a US veteran so the hospitals file is reused
generate.providers.veterans.default_file = providers/hospitals.csv
generate.providers.ihs.hospitals.default_file =
generate.providers.ihs.primarycare.default_file =
generate.providers.selection_behavior = nearest
generate.providers.maximum_search_distance = 400
generate.providers.default_to_hospital_on_failure = true

# ---------------------------------------------------------------- payers
generate.payers.insurance_companies.default_file = payers/insurance_companies.csv
generate.payers.insurance_plans.default_file = payers/insurance_plans.csv
generate.payers.insurance_plans.eligibilities_file = payers/insurance_eligibilities.csv
# no South African payer plays the Medicare/Medicaid/Dual roles; the names must still be set
generate.payers.insurance_companies.medicare = Medicare
generate.payers.insurance_companies.medicaid = Medicaid
generate.payers.insurance_companies.dual_eligible = Dual Eligible
generate.payers.selection_behavior = priority
generate.payers.insurance_plans.income_premium_ratio = 0.10
generate.insurance.mandate.year = 2100
generate.insurance.employer_coverage = 0.50

# ---------------------------------------------------------------- lifestyle
lifecycle.death_by_natural_causes = false
lifecycle.quit_smoking.baseline = 0.008
# SADHS 2016: about 20% of adults smoke (men 37%, women 7%); alcohol use disorders are common
lifecycle.smoking.probability = 0.21
lifecycle.alcoholism.probability = 0.06
